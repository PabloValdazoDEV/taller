# Producción en el VPS (Plesk). La app escucha solo en localhost:3100;
# el nginx de Plesk hace de proxy inverso con HTTPS (Let's Encrypt).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://taller:${POSTGRES_PASSWORD}@db:5432/taller
      STORAGE_DIR: /data/storage
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taller
    ports:
      - "127.0.0.1:5433:5432" # solo localhost (para túnel SSH / backups); nunca expuesto a internet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  storage:
